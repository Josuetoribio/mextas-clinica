<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--surface-page);font-family:var(--font-sans)}.p{padding:20px 24px}</style></head><body><div class="p" style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px">
<div><div style="height:56px;border-radius:var(--radius-sm);background:var(--surface-page);border:1px solid var(--line-hairline)"></div><div style="margin-top:8px;font-size:11px;font-weight:600;color:var(--text-body)">página</div><div style="font-size:11px;color:var(--text-muted)">surface-page</div></div><div><div style="height:56px;border-radius:var(--radius-sm);background:var(--surface-card);border:1px solid var(--line-hairline)"></div><div style="margin-top:8px;font-size:11px;font-weight:600;color:var(--text-body)">card</div><div style="font-size:11px;color:var(--text-muted)">surface-card</div></div><div><div style="height:56px;border-radius:var(--radius-sm);background:var(--surface-inverse);border:1px solid var(--line-hairline)"></div><div style="margin-top:8px;font-size:11px;font-weight:600;color:var(--text-body)">inversa</div><div style="font-size:11px;color:var(--text-muted)">surface-inverse</div></div><div><div style="height:56px;border-radius:var(--radius-sm);background:var(--status-success);border:1px solid var(--line-hairline)"></div><div style="margin-top:8px;font-size:11px;font-weight:600;color:var(--text-body)">éxito</div><div style="font-size:11px;color:var(--text-muted)">status-success</div></div><div><div style="height:56px;border-radius:var(--radius-sm);background:var(--status-warning);border:1px solid var(--line-hairline)"></div><div style="margin-top:8px;font-size:11px;font-weight:600;color:var(--text-body)">aviso</div><div style="font-size:11px;color:var(--text-muted)">status-warning</div></div><div><div style="height:56px;border-radius:var(--radius-sm);background:var(--status-danger);border:1px solid var(--line-hairline)"></div><div style="margin-top:8px;font-size:11px;font-weight:600;color:var(--text-body)">urgencia</div><div style="font-size:11px;color:var(--text-muted)">status-danger</div></div>
</div></body></html>
