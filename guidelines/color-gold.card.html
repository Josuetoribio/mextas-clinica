<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--surface-page);font-family:var(--font-sans)}.p{padding:20px 24px}</style></head><body><div class="p" style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px">

<span style="font-size:12px;font-weight:600;letter-spacing:.16em;color:var(--text-eyebrow)">NUESTRAS ESPECIALIDADES</span>
<span style="font-size:13px;color:var(--text-muted)">✓ correcto</span>
<span style="background:var(--gold-600);color:#fff;padding:8px 16px;border-radius:var(--radius-sm);font-size:13px">Agendar cita</span>
