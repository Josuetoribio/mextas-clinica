function SearchOverlay({open,onClose,go}){
  const [q,setQ]=React.useState('');
  const ref=React.useRef(null);
  React.useEffect(()=>{if(open&&ref.current)ref.current.focus()},[open]);
  const t=q.toLowerCase().trim();
  const res=!t?[]:[
    ...D.specialties.filter(s=>s.name.toLowerCase().includes(t)).map(s=>({k:'Especialidad',l:s.name,i:s.icon,go:'especialidad:'+s.slug})),
    ...D.doctors.filter(d=>(d.name+d.specialty+d.sub).toLowerCase().includes(t)).map(d=>({k:'Médico',l:d.name+' · '+d.specialty,i:'user-round',go:'medicos'})),
    ...D.services.filter(s=>(s.name+s.desc).toLowerCase().includes(t)).map(s=>({k:'Servicio',l:s.name,i:s.icon,go:'servicios'})),
    ...D.checkups.filter(c=>(c.name+c.includes.join(' ')+' check-up cardiovascular').toLowerCase().includes(t)).map(c=>({k:'Check-up',l:c.name,i:'clipboard-check',go:'checkups'})),
    ...D.facilities.filter(f=>f.name.toLowerCase().includes(t)).map(f=>({k:'Instalación',l:f.name,i:f.icon,go:'instalaciones'})),
    ...D.locations.filter(s=>(s.name+s.city).toLowerCase().includes(t)).map(s=>({k:'Sede',l:s.name,i:'map-pin',go:'sedes'})),
    ...D.articles.map((a,i)=>({a,i})).filter(({a})=>(a.title+a.cat).toLowerCase().includes(t)).map(({a,i})=>({k:'Artículo',l:a.title,i:'file-text',go:'articulo:'+i}))].slice(0,9);
  if(!open) return null;
  return <div onClick={onClose} style={{position:'fixed',inset:0,zIndex:95,background:'rgba(18,39,31,.45)',backdropFilter:'blur(3px)',paddingTop:'12vh',display:'flex',justifyContent:'center',animation:'cmRise var(--dur-base) var(--ease-standard)'}}>
    <div onClick={e=>e.stopPropagation()} style={{width:'min(640px,92vw)',height:'fit-content',background:'var(--surface-raised)',borderRadius:'var(--radius-lg)',boxShadow:'var(--shadow-lg)',overflow:'hidden'}}>
      <div style={{display:'flex',alignItems:'center',gap:12,padding:'18px 22px',borderBottom:'1px solid var(--line-hairline)'}}>
        <Icon name="search" size={19} color="var(--text-muted)"/>
        <input ref={ref} value={q} onChange={e=>setQ(e.target.value)} placeholder="Busca médicos, especialidades, servicios o sedes"
          onKeyDown={e=>e.key==='Escape'&&onClose()}
          style={{flex:1,border:'none',outline:'none',fontFamily:'var(--font-sans)',fontSize:16,color:'var(--text-body)',background:'none'}}/>
        <kbd style={{fontSize:11,color:'var(--text-muted)',border:'1px solid var(--line-hairline)',borderRadius:4,padding:'3px 7px'}}>Esc</kbd>
      </div>
      <div style={{maxHeight:'50vh',overflowY:'auto'}}>
        {!t&&<div style={{padding:22}}><Eyebrow>Búsquedas frecuentes</Eyebrow>
          <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:14}}>{['cardio','pediatría','laboratorio','San Pedro','check-up'].map(x=><Chip key={x} onClick={()=>setQ(x)}>{x}</Chip>)}</div></div>}
        {t&&!res.length&&<p style={{padding:26,fontSize:14,color:'var(--text-muted)',margin:0}}>Sin resultados para “{q}”. Prueba con una especialidad o el nombre de un médico.</p>}
        {res.map((r,i)=><button key={i} onClick={()=>{onClose();go(r.go)}}
          style={{display:'flex',width:'100%',gap:13,alignItems:'center',padding:'13px 22px',background:'none',border:'none',borderBottom:'1px solid var(--line-hairline)',cursor:'pointer',textAlign:'left',fontFamily:'var(--font-sans)'}}
          onMouseEnter={e=>e.currentTarget.style.background='var(--ivory-100)'} onMouseLeave={e=>e.currentTarget.style.background='none'}>
          <Icon name={r.i} size={17} color="var(--gold-600)"/>
          <span style={{fontSize:14.5,color:'var(--text-body)',flex:1}}>{r.l}</span>
          <Badge tone="neutral" size="sm">{r.k}</Badge></button>)}
      </div>
    </div></div>;
}

function CookieBanner(){
  /* Con los datos del sitio bloqueados, localStorage lanza un error: el aviso se muestra y se cierra igual. */
  const [show,setShow]=React.useState(()=>{try{return localStorage.getItem('cm_cookies')===null}catch(e){return true}});
  const [cfg,setCfg]=React.useState(false);
  const [prefs,setPrefs]=React.useState({necesarias:true,analiticas:true,preferencias:false});
  const save=v=>{try{localStorage.setItem('cm_cookies',JSON.stringify(v||prefs))}catch(e){}setShow(false);setCfg(false)};
  if(!show) return null;
  return <><div className="cm-cookie" style={{position:'fixed',left:0,right:0,bottom:0,zIndex:70,padding:'0 var(--gutter) 18px'}}>
    <div style={{maxWidth:'var(--container-max)',margin:'0 auto',background:'var(--surface-raised)',border:'1px solid var(--line-hairline)',borderRadius:'var(--radius-md)',boxShadow:'var(--shadow-lg)',padding:'18px 22px',display:'flex',gap:20,alignItems:'center',flexWrap:'wrap',animation:'cmRise var(--dur-slow) var(--ease-entrance)'}}>
      <Icon name="cookie" size={22} color="var(--gold-600)"/>
      <p style={{fontSize:13.5,color:'var(--text-body)',margin:0,flex:1,minWidth:260,lineHeight:1.6}}>Utilizamos cookies para mejorar la experiencia y analizar el funcionamiento del sitio.</p>
      <div style={{display:'flex',gap:9,flexWrap:'wrap'}}>
        <Button size="sm" variant="ghost" onClick={()=>save({necesarias:true,analiticas:false,preferencias:false})}>Solo necesarias</Button>
        <Button size="sm" variant="secondary" onClick={()=>setCfg(true)}>Configurar</Button>
        <Button size="sm" onClick={()=>save({necesarias:true,analiticas:true,preferencias:true})}>Aceptar</Button></div>
    </div></div>
  <Modal open={cfg} onClose={()=>setCfg(false)} size="sm" eyebrow="Cookies" title="Configura tus preferencias"
    footer={<><Button variant="ghost" onClick={()=>setCfg(false)}>Cancelar</Button><Button onClick={()=>save()}>Guardar preferencias</Button></>}>
    {[['necesarias','Necesarias','Imprescindibles para el funcionamiento del sitio. No se pueden desactivar.'],
      ['analiticas','Analíticas','Nos ayudan a entender cómo se usa el sitio.'],
      ['preferencias','Preferencias','Recuerdan tus ajustes, como la sede seleccionada.']].map(([k,l,d])=>
      <div key={k} style={{display:'flex',justifyContent:'space-between',gap:20,alignItems:'flex-start',padding:'16px 0',borderBottom:'1px solid var(--line-hairline)'}}>
        <div><div style={{fontSize:14.5,fontWeight:600,color:'var(--text-heading)'}}>{l}</div>
        <div style={{fontSize:12.5,color:'var(--text-muted)',marginTop:4,lineHeight:1.5}}>{d}</div></div>
        <button type="button" disabled={k==='necesarias'} aria-pressed={prefs[k]} aria-label={l}
          onClick={()=>setPrefs(p=>({...p,[k]:!p[k]}))}
          style={{width:42,height:24,flex:'0 0 42px',borderRadius:999,border:'none',cursor:k==='necesarias'?'not-allowed':'pointer',opacity:k==='necesarias'?.5:1,
            background:prefs[k]?'var(--green-800)':'var(--ivory-400)',position:'relative',transition:'background var(--dur-fast) var(--ease-standard)'}}>
          <span style={{position:'absolute',top:3,left:prefs[k]?21:3,width:18,height:18,borderRadius:'50%',background:'#fff',transition:'left var(--dur-fast) var(--ease-standard)'}}/></button>
      </div>)}
  </Modal></>;
}

/* Desplaza a una sección de la portada. Corrige la posición al terminar por si
   alguna imagen diferida cambió la altura de lo que hay arriba durante el desplazamiento. */
function toSection(k,smooth){
  const behavior=smooth?'smooth':'instant';
  if(k==='inicio') return window.scrollTo({top:0,behavior});
  const el=document.getElementById(k);if(!el)return;
  el.scrollIntoView({behavior,block:'start'});
  const t0=performance.now();let t;
  const settle=()=>{clearTimeout(t);t=setTimeout(()=>{window.removeEventListener('scroll',settle);
    if(performance.now()-t0>2500)return;
    const off=el.getBoundingClientRect().top-(parseFloat(getComputedStyle(el).scrollMarginTop)||0);
    if(Math.abs(off)>4)el.scrollIntoView({behavior:'instant',block:'start'})},160)};
  window.addEventListener('scroll',settle,{passive:true});settle();
}

function App(){
  const [page,setPage]=React.useState('inicio');
  const [book,setBook]=React.useState(null);
  const [search,setSearch]=React.useState(false);
  const [scrolled,setScrolled]=React.useState(false);
  const [svc,setSvc]=React.useState(null);
  const [spy,setSpy]=React.useState('inicio');
  const pending=React.useRef(NAV.some(n=>'#'+n[0]===location.hash)?location.hash.slice(1):null);
  React.useEffect(()=>{
    const h=()=>setScrolled(window.scrollY>60);window.addEventListener('scroll',h);return()=>window.removeEventListener('scroll',h)},[]);
  React.useEffect(()=>{
    const k=pending.current;pending.current=null;
    if(k&&page==='inicio') requestAnimationFrame(()=>toSection(k,false));
    else window.scrollTo({top:0,behavior:'instant'});
    window.lucide&&window.lucide.createIcons()},[page]);
  /* Sección activa del menú mientras se recorre la portada. */
  React.useEffect(()=>{if(page!=='inicio')return;
    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)setSpy(e.target.id)}),{rootMargin:'-35% 0px -60% 0px'});
    NAV.forEach(([k])=>{const el=document.getElementById(k);el&&io.observe(el)});
    return()=>io.disconnect()},[page]);
  React.useEffect(()=>{const k=e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();setSearch(true)}};window.addEventListener('keydown',k);return()=>window.removeEventListener('keydown',k)},[]);
  const go=p=>{if(location.hash)history.replaceState(null,'',location.pathname+location.search);setPage(p)};
  /* El menú baja a su sección de la portada; desde otra página, vuelve a la portada y baja. */
  const goSection=k=>{
    history.replaceState(null,'',location.pathname+location.search+(k==='inicio'?'':'#'+k));
    if(page==='inicio') return toSection(k,true);
    pending.current=k;setPage('inicio');
  };
  const openBook=(preset)=>setBook(preset&&preset.name?{specialty:preset.specialty,doctor:preset.name,location:'Sede '+preset.location}:(preset||{}));
  const base=page.split(':')[0], arg=page.split(':')[1];
  return <>
    <Header page={page==='inicio'?spy:base==='especialidad'||base==='especialidades-todas'?'especialidades':base} goSection={goSection} onBook={()=>openBook()} onSearch={()=>setSearch(true)} scrolled={scrolled}/>
    <main key={page} style={{animation:'cmRise var(--dur-slow) var(--ease-entrance)'}}>
      {page==='inicio'&&<>
        <Hero onBook={()=>openBook()} go={go}/>
        <QuickActions onBook={()=>openBook()} go={go}/>
        <AboutTeaser go={go}/>
        <Specialties go={go}/>
        <Services onOpen={setSvc} tone="page"/>
        <CheckupTeaser go={go}/>
        <Doctors go={go} onBook={openBook}/>
        <Stats/>
        <FacilitiesTeaser go={go}/>
        <LocationsPage onBook={openBook} go={go} embedded/>
        <FirstVisit go={go}/>
        <Emergency go={go}/>
        <Faq/>
        <Blog go={go}/>
        <ContactBlock/>
      </>}
      {base==='medicos'&&<DirectoryPage onBook={openBook} go={go}/>}
      {base==='especialidad'&&<SpecialtyPage slug={page.split(':')[1]} onBook={openBook} go={go}/>}
      {(base==='especialidades'||base==='especialidades-todas')&&<AllSpecialties go={go}/>}
      {base==='sedes'&&<LocationsPage onBook={openBook} go={go}/>}
      {base==='servicios'&&<><Section py="var(--space-7) 0 0"><Crumbs go={go} items={[['Servicios']]}/></Section><Services onOpen={setSvc}/><CheckupTeaser go={go}/><Emergency go={go}/></>}
      {base==='instalaciones'&&<FacilitiesPage go={go}/>}
      {base==='tecnologia'&&<TechnologyPage go={go}/>}
      {base==='checkups'&&<CheckupsPage go={go}/>}
      {base==='pacientes'&&<PatientsPage tab={arg} go={go}/>}
      {base==='articulo'&&<ArticlePage idx={+arg||0} go={go} onBook={openBook}/>}
      {base==='urgencias'&&<UrgenciasPage go={go}/>}
      {base==='legal'&&<LegalPage kind={arg} go={go}/>}
      {base==='blog'&&<><Section py="var(--space-7) 0 0"><Crumbs go={go} items={[['Blog']]}/></Section><Blog go={go}/></>}
      {base==='contacto'&&<ContactBlock/>}
      {base==='nosotros'&&<>
        <AboutTeaser go={go} full/>
        <Section tone="raised">
          <SectionHeading align="center" eyebrow="Nuestro modelo de atención" title="Cinco momentos en cada consulta"/>
          <div className="cm-serv-grid" style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:14,marginTop:44}}>
            {[['ear','Escuchamos'],['search-check','Evaluamos'],['message-square-text','Explicamos'],['heart-handshake','Acompañamos'],['repeat','Damos seguimiento']].map(([i,l],k)=>
              <div key={l} style={{textAlign:'center',padding:'0 8px',borderLeft:k?'1px solid var(--line-hairline)':'none'}}>
                <Icon name={i} size={28} color="var(--gold-600)"/>
                <div style={{fontFamily:'var(--font-display)',fontSize:19,marginTop:14,color:'var(--text-heading)'}}>{l}</div>
                <div style={{fontSize:12.5,color:'var(--text-muted)',marginTop:7}}>Paso {k+1}</div></div>)}
          </div>
        </Section>
        <Section>
          <SectionHeading align="center" eyebrow="Nuestros valores" title="Lo que no negociamos"/>
          <div style={{display:'flex',gap:10,flexWrap:'wrap',justifyContent:'center',marginTop:32}}>
            {['Empatía','Excelencia','Confianza','Innovación','Ética','Cercanía'].map(v=><Badge key={v} tone="green">{v}</Badge>)}</div>
        </Section>
      </>}
    </main>
    <Footer go={go} goSection={goSection} onBook={()=>openBook()}/>
    <BookingWizard open={!!book} onClose={()=>setBook(null)} preset={book}/>
